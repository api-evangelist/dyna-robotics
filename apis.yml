name: Dyna Robotics
image: https://www.dyna.co/dyna-logo.png
description: 'Dyna Robotics is a Redwood City, California robotics AI company founded
  in 2024 by Lindon Gao, York Yang and Jason Ma to build robot foundation models for
  real-world commercial automation. Its DYNA-1 vision-language-action (VLA) model drives
  pairs of stationary robotic arms through high-dexterity tasks such as napkin folding
  and garment handling, and the company reports a 99%+ autonomous success rate over
  24-hour continuous runs. Dyna targets commercial laundry, food service and factory
  environments, and closed a $120M Series A in September 2025 led by Robostrategy,
  CRV and First Round Capital with participation from NVentures, the Amazon Industrial
  Innovation Fund, Salesforce Ventures, Samsung Next and LG Technology Ventures, following
  a $23.5M seed. Dyna sells robotics-as-a-service rather than software: enrichment probing
  of dyna.co found no public developer API, OpenAPI/AsyncAPI/GraphQL contract, SDK,
  developer portal, MCP server, agent card, or event surface.'
